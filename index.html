function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function show(which){for(const id of ['home','game','celebrate'])$(id).classList.toggle('hidden',id!==which)}
function refill(){deck=shuffle(DATA.filter(x=>region==='Todas'||x.region===region).slice());if(previous!==null&&deck.length>1&&deck[0].id===previous){[deck[0],deck[1]]=[deck[1],deck[0]]}index=0}
function start(which){clearTimeout(timer);region=which;hits=0;previous=null;refill();show('game');render()}
function render(){if(index>=deck.length)refill();answered=false;waiting=false;const q=deck[index];$('regionLabel').textContent='◓ '+(region==='Todas'?'Kanto + Kalos':region);$('counter').textContent=`⭐ ${hits} aciertos`;$('silhouette').src=q.image;$('feedback').textContent='';let opts=shuffle(q.options.slice());$('answers').replaceChildren(...opts.map(name=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>choose(b,name,q);return b}));}
function advance(){previous=deck[index].id;index++;render()}
function choose(button,name,q){if(answered)return;answered=true;let right=name===q.name;if(right)hits++;for(let b of $('answers').children){b.disabled=true;if(b.textContent===q.name)b.classList.add('correct');else if(b===button)b.classList.add('wrong')}$('feedback').textContent=right?'¡Pokémon descubierto!':'¡Sigue intentándolo, entrenadora!';$('counter').textContent=`⭐ ${hits} aciertos`;timer=setTimeout(()=>{if(right&&hits%5===0){$('praise').textContent=praises[(hits/5-1)%praises.length];show('celebrate');waiting=true}else advance()},1100)}
$('continue').onclick=()=>{if(!waiting)return;show('game');advance()};
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>start(b.dataset.region));
$('back').onclick=()=>{clearTimeout(timer);show('home')};
</script></body></html>
